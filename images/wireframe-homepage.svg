<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1032" width="760" height="1032" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Low-fidelity wireframe of the JFC homepage, nine stacked blocks">
  <style>
    .fr { fill: #8a8a8a; fill-opacity: .04; stroke: #8a8a8a; stroke-opacity: .35; }
    .blk { fill: #8a8a8a; fill-opacity: .05; stroke: #8a8a8a; stroke-opacity: .45; stroke-dasharray: 4 3; }
    .lbl { font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; fill: #FF3333; }
    .bar { fill: #8a8a8a; fill-opacity: .42; }
    .ttl { fill: #8a8a8a; fill-opacity: .68; }
    .faint { fill: #8a8a8a; fill-opacity: .2; }
    .box { fill: #8a8a8a; fill-opacity: .14; stroke: #8a8a8a; stroke-opacity: .35; }
    .btn { fill: #C90404; }
    .btnt { font-size: 10.5px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .ghost { fill: none; stroke: #8a8a8a; stroke-opacity: .5; }
    .ghostt { font-size: 10.5px; fill: #8a8a8a; text-anchor: middle; }
    .ph { font-size: 10px; fill: #8a8a8a; text-anchor: middle; }
    .dot { fill: #8a8a8a; fill-opacity: .45; }
  </style>

